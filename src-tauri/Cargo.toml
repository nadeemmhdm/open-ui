[package]
name = "open-ui"
version = "0.1.0-alpha.1"
description = "Open-source, offline-first visual UI builder"
authors = ["Nadeem Muhammed", "Open UI contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "open_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

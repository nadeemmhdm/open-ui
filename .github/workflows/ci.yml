name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Verify release security policy
        shell: bash
        run: |
          grep -q "object-src 'none'" src-tauri/tauri.conf.json
          grep -q "frame-src 'none'" src-tauri/tauri.conf.json
          grep -q '"targets": \["msi", "nsis"\]' src-tauri/tauri.conf.json
          test -f RELEASE.md

  windows-desktop:
    name: Windows desktop verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Disable signed updater artifacts for CI verification
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8
      - name: Build Windows desktop app
        run: npm run desktop:build
      - name: Verify installer bundles
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $msi) { throw "MSI bundle missing" }
          if (-not $nsis) { throw "NSIS bundle missing" }
